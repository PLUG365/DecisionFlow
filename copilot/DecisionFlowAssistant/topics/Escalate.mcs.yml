      - 折り返し電話してください
      - サポートに電話する
      - テクニカル サポートに電話する
      - エージェントから折り返し電話をください
      - 直接電話する
      - 別の担当者に代わってください
      - 人間のエージェントからサポートを受けたいのですが
      - 人間の担当者に電話を取り次いでください
      - 電話番号を教えてください。または折り返し電話をください
      - 担当者から折り返し電話してください
      - 指定した時間に電話してください
      - 上席者に電話を代わってください
      - 人間と話せますか
