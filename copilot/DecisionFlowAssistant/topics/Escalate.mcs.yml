  actions:
    - kind: SendActivity
      id: sendMessage_s39DCt
      conversationOutcome: Escalated
      activity: |-
        現在、このコパイロットでは担当者へのエスカレーションが構成されていません。エージェントは別の方法で担当者に連絡する方法について情報を提供できます。

        他に何かお手伝いできますか?