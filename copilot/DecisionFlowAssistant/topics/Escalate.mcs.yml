mcs.metadata:
  componentName: エスカレートする
  description: |-
    このシステム トピックは、ユーザーが担当者と話す必要があることを示すとトリガーされます。
    人間へのハンドオフが必要なシナリオに対するエージェントの対応方法は、ボット設定で構成できます。
    エージェントでエスカレーションに対応しない場合は、このトピックは無効にする必要があります。
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnEscalate
  id: main
  intent:
    displayName: エスカレートする
    includeInOnSelectIntent: false
    triggerQueries:
      - エージェントと話す
      - 人間と話す
      - 人間の担当者に代わってください
      - 折り返し電話
