      - 折り返し電話をください
      - 人間とチャットする
      - 上席者とチャットする
      - 人間のエージェントとチャットする
      - 別の担当者とチャットします
      - 人間のエージェントにつないでください
      - 人間の担当者につないでください
      - 人間の担当者から折り返し電話をください
