mcs.metadata:
  componentName: 会話へ投稿
kind: AdaptiveDialog
modelDescription: 「この申請にコメントして」「会話に投稿して」「関係者に共有して」
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: ConditionGroup
      id: validateApplicationContext
      conditions:
        - id: missingApplicationContext
          condition: =IsBlank(Topic.applicationId)
          actions:
            - kind: SendActivity
              id: sendMissingApplicationContext
              activity: 投稿先の申請を特定できませんでした。申請の詳細画面または申請リンクから、もう一度お試しください。

            - kind: EndConversation
              id: endMissingApplicationContext

    - kind: ConditionGroup
      id: validateMessageBody
      conditions:
        - id: missingMessageBody
          condition: =IsBlank(Topic.messageBody)
          actions:
            - kind: SendActivity
              id: sendMissingMessageBody
              activity: 投稿する内容を教えてください。

            - kind: EndConversation
              id: endMissingMessageBody

    - kind: SendActivity
      id: sendPostPreview
      activity: |-
        次の内容で申請の会話へ投稿します。

        {Topic.messageBody}

    - kind: Question
      id: confirmPost
      variable: init:Topic.postConfirmed
      prompt: 上の内容で投稿してよろしいですか。
      entity: BooleanPrebuiltEntity
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: false

    - kind: ConditionGroup
      id: handleConfirmation
      conditions:
        - id: postDeclined
          condition: =Topic.postConfirmed = false
          actions:
            - kind: SendActivity
              id: sendPostDeclined
              activity: 投稿を取りやめました。文面を変えたい場合は、内容を教えてください。

            - kind: EndConversation
              id: endPostDeclined

    - kind: SetVariable
      id: setActorUpn
      variable: Topic.actorUpn
      value: =System.User.PrincipalName

    - kind: SetVariable
      id: setActorAadObjectId
      variable: Topic.actorAadObjectId
      value: =System.User.Id

    - kind: InvokeFlowAction
      id: invokePostApplicationMessage
      input:
        binding:
          actorAadObjectId: =Topic.actorAadObjectId
          actorUpn: =Topic.actorUpn
          applicationId: =Topic.applicationId
          body: =Topic.messageBody

      output:
        binding:
          message: Topic.postMessage
          messageId: Topic.postedMessageId
          status: Topic.postStatus

      flowId: 3dfc08d1-7e92-f111-b8db-7c1e524a54ce

    - kind: ConditionGroup
      id: handlePostResult
      conditions:
        - id: postSucceeded
          condition: =Topic.postStatus = "succeeded"
          actions:
            - kind: SendActivity
              id: sendPostSucceeded
              activity: 会話に投稿しました。アプリの会話タブで確認できます。

      elseActions:
        - kind: SendActivity
          id: sendPostFailed
          activity: |-
            会話に投稿できませんでした。

            {Coalesce(Topic.postMessage, "詳細を取得できませんでした。")}

    - kind: EndConversation
      id: endTopic

inputType:
  properties:
    applicationId:
      displayName: applicationId
      description: 投稿先の ds_application ID。Dataverse の申請情報または Code Apps 申請詳細リンクから取得した GUID。
      type: String

    messageBody:
      displayName: messageBody
      description: 会話へ投稿する本文。ユーザーが書いた、または提示して同意を得た文面をそのまま渡す。要約や創作をしない。
      type: String

outputType: {}
