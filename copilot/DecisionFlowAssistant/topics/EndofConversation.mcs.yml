mcs.metadata:
  componentName: 会話の終了
  description: |-
    このシステム トピックは、リダイレクト アクションによってのみトリガーされ、
    ユーザーがエージェントとの会話の評価できるようにガイドします。
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnSystemRedirect
  id: main
  actions:
    - kind: Question
      id: 41d42054-d4cb-4e90-b922-2b16b37fe379
      conversationOutcome: ResolvedImplied
      alwaysPrompt: true
      variable: init:Topic.SurveyResponse
      prompt: この回答でよろしいでしょうか?
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: condition-0
      conditions:
        - id: condition-0-item-0
          condition: =Topic.SurveyResponse = true
          actions:
            - kind: CSATQuestion
              id: csat_1
              conversationOutcome: ResolvedConfirmed

            - kind: SendActivity
              id: sendMessage_8r29O0
              activity: フィードバックをありがとうございます。

            - kind: Question
              id: question_1
              alwaysPrompt: true
              variable: init:Topic.Continue
              prompt: 他に何かお手伝いできますか?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: condition-1
              conditions:
                - id: condition-1-item-0
                  condition: =Topic.Continue = true
                  actions:
                    - kind: SendActivity
                      id: sendMessage_4eOE6h
                      activity: さあ、どうぞ。お聞きします。

              elseActions:
                - kind: SendActivity
                  id: yHBz55
                  activity: お問い合わせありがとうございました。

                - kind: EndConversation
                  id: jh1GMT

      elseActions:
        - kind: Question
          id: PM68ot
          alwaysPrompt: true
          variable: init:Topic.TryAgain
          prompt: お役に立てず、申し訳ありません。この用件をやり直しますか?
          entity: BooleanPrebuiltEntity

        - kind: ConditionGroup
          id: KNxYBf
          conditions:
            - id: DPveFP
              condition: =Topic.TryAgain = false
              actions:
                - kind: BeginDialog
                  id: cngqi4
                  dialog: ds_DecisionFlowAssistant.topic.Escalate

          elseActions:
            - kind: SendActivity
              id: GrVHEW
              activity: さあ、どうぞ。お聞きします。